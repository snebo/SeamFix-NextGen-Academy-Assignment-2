<app-navbar [cartCount]="(cartCount$ | async) ?? 0"></app-navbar>

<div class="product-detail-container">
  <button class="back-button" (click)="goBack()">← Back to Products</button>

  <!-- 1. Loading State -->
  <div *ngIf="loading$ | async" class="centered-message">
    <div>
      <div class="loading-spinner"></div>
      <p>Loading product details...</p>
    </div>
  </div>

  <!-- 2. Error State -->
  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <!-- 3. Success and Not Found States -->
  <ng-container *ngIf="!(loading$ | async) && !errorMessage">
    <div *ngIf="product$ | async as product; else notFound">
      <div class="product-detail">
        <div class="product-image-section">
          <img [src]="product.imageUrl" [alt]="product.name" class="product-image">
          <span class="category-badge">{{ product.category }}</span>
        </div>

        <div class="product-info">
          <h1>{{ product.name }}</h1>
          <p class="description">{{ product.description }}</p>
          <p class="price">{{ product.price | currency }}</p>

          <div class="product-meta">
            <div class="meta-item">
              <strong>Category:</strong> {{ product.category }}
            </div>
            <div class="meta-item">
              <strong>Product ID:</strong> {{ product.id }}
            </div>
          </div>

          <button
            class="cart-button"
            [class.in-cart]="isInCart$ | async"
            (click)="toggleCart()">
            {{ (isInCart$ | async) ? '✓ In Cart' : '+ Add to Cart' }}
          </button>
        </div>
      </div>
    </div>
  </ng-container>

  <!-- Template for "Not Found" state -->
  <ng-template #notFound>
    <div class="centered-message">
      <p>Product not found.</p>
    </div>
  </ng-template>
</div>
