<app-navbar [cartCount]="(cartCount$ | async) ?? 0"></app-navbar>

<div class="cart-container" *ngIf="cart$ | async as cartItems">
  <h1>Shopping Cart</h1>

  <!-- Empty State -->
  <div *ngIf="cartItems.length === 0" class="empty-cart">
    <p>Your cart is empty</p>
    <button (click)="continueShopping()">Continue Shopping</button>
  </div>

  <!-- Content State -->
  <div *ngIf="cartItems.length > 0" class="cart-content">
    <div class="cart-items">
      <div *ngFor="let item of cartItems" class="cart-item">
        <img [src]="item.imageUrl" [alt]="item.name" class="item-image">
        <div class="item-details">
          <h3 class="item-name">{{ item.name }}</h3>
          <p class="item-price">{{ item.price | currency }}</p>
        </div>
        <button (click)="removeFromCart(item.id)" class="remove-button">Remove</button>
      </div>
    </div>

    <div class="cart-summary">
      <h2 class="summary-title">Cart Summary</h2>
      <div class="summary-details">
        <p>Total Items: {{ cartItems.length }}</p>
        <p>Total Price: {{ totalPrice$ | async | currency }}</p>
      </div>
      <button class="checkout-button">Proceed to Checkout</button>
    </div>
  </div>
</div>
