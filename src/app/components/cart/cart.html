<app-navbar [cartCount]="cart.length"></app-navbar>
<div class="cart-container">
  <h1>Shopping Cart</h1>

  <div *ngIf="cartItems.length === 0" class="empty-cart">
    <p>Your cart is empty</p>
    <button (click)="continueShopping()">Continue Shopping</button>
  </div>

  <div *ngIf="cartItems.length > 0" class="cart-content">
    <div class="cart-items">
      <h2>Items in Cart ({{ cartItems.length }})</h2>
      <ul class="cart-list">
        <li *ngFor="let item of cartItems; let i = index" class="cart-item-name">
          {{ i + 1 }}. {{ item.name }}
        </li>
      </ul>
    </div>

    <div class="cart-actions">
      <button class="continue-button" (click)="continueShopping()">
        Continue Shopping
      </button>
    </div>
  </div>
</div>
