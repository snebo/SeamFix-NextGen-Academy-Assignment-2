<app-navbar
  [cartCount]="cart.length"
  (searchRequest)="handleSearch($event)">
</app-navbar>
<main class="product-grid">
  <app-product-card
    *ngFor="let item of filteredProducts"
    [product]="item"
    [isSelected]="isProductInCart(item.id)"
    (addToCart)="handleAddToCart($event)">
  </app-product-card>
</main>
