<app-navbar></app-navbar>

<div class="form-container">
  <h2>Create New Product</h2>
  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">

    <!-- Global Error Message -->
    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" formControlName="name" />
      <div *ngIf="productForm.get('name')?.invalid && productForm.get('name')?.touched" class="error">
        Name is required and must be at least 3 characters long.
      </div>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description"></textarea>
      <div *ngIf="productForm.get('description')?.invalid && productForm.get('description')?.touched" class="error">
        Description is required and must be at least 10 characters long.
      </div>
    </div>

    <div class="form-group">
      <label for="price">Price</label>
      <input id="price" type="number" formControlName="price" />
      <div *ngIf="productForm.get('price')?.invalid && productForm.get('price')?.touched" class="error">
        Price is required and must be at least 50.
      </div>
    </div>

    <div class="category-section">
      <div class="category-header">
        <label>Category</label>
        <button type="button" class="toggle-btn" (click)="toggleCategoryType()">
          {{ isNewCategory ? 'Select Existing' : 'Create New' }}
        </button>
      </div>

      <!-- Select Existing -->
      <div *ngIf="!isNewCategory" class="form-group">
        <select id="categoryId" formControlName="categoryId">
          <option value="" disabled selected>Select a category</option>
          <option *ngFor="let cat of categories$ | async" [value]="cat.id">{{ cat.name }}</option>
        </select>
        <div *ngIf="productForm.get('categoryId')?.invalid && productForm.get('categoryId')?.touched" class="error">
          Category is required.
        </div>
      </div>

      <!-- Create New -->
      <div *ngIf="isNewCategory" class="new-category-fields">
        <div class="form-group">
          <label for="newCategoryName">New Category Name</label>
          <input id="newCategoryName" formControlName="newCategoryName" placeholder="Enter category name" />
          <div *ngIf="productForm.get('newCategoryName')?.invalid && productForm.get('newCategoryName')?.touched" class="error">
            Category name is required (min 3 chars).
          </div>
        </div>

        <div class="form-group">
          <label for="newCategoryDescription">New Category Description (Optional)</label>
          <input id="newCategoryDescription" formControlName="newCategoryDescription" placeholder="What is this category about?" />
        </div>
      </div>
    </div>

    <div class="form-group">
      <label for="imageUrl">Image URL</label>
      <input id="imageUrl" formControlName="imageUrl" />
      <div *ngIf="productForm.get('imageUrl')?.invalid && productForm.get('imageUrl')?.touched" class="error">
        A valid Image URL is required.
      </div>
    </div>

    <button type="submit" class="submit-btn" [disabled]="productForm.invalid || (loading$ | async)">
      {{ (loading$ | async) ? 'Creating...' : 'Create Product' }}
    </button>
  </form>
</div>
