<div class="form-container">
  <h2>Create New Product</h2>
  <form [formGroup]="productForm" (ngSubmit)="onSubmit()">

    <!-- Global Error Message -->
    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>

    <div class="form-group">
      <label for="name">Name</label>
      <input id="name" formControlName="name" />
      <div *ngIf="productForm.get('name')?.invalid && productForm.get('name')?.touched" class="error">
        Name is required and must be at least 3 characters long.
      </div>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <textarea id="description" formControlName="description"></textarea>
      <div *ngIf="productForm.get('description')?.invalid && productForm.get('description')?.touched" class="error">
        Description is required and must be at least 10 characters long.
      </div>
    </div>

    <div class="form-group">
      <label for="price">Price</label>
      <input id="price" type="number" formControlName="price" />
      <div *ngIf="productForm.get('price')?.invalid && productForm.get('price')?.touched" class="error">
        Price is required and must be at least 50.
      </div>
    </div>

    <div class="form-group">
      <label for="category">Category</label>
      <input id="category" formControlName="category" />
      <div *ngIf="productForm.get('category')?.invalid && productForm.get('category')?.touched" class="error">
        Category is required.
      </div>
    </div>

    <div class="form-group">
      <label for="imageUrl">Image URL</label>
      <input id="imageUrl" formControlName="imageUrl" />
      <div *ngIf="productForm.get('imageUrl')?.invalid && productForm.get('imageUrl')?.touched" class="error">
        A valid Image URL is required.
      </div>
    </div>

    <button type="submit" [disabled]="productForm.invalid || (loading$ | async)">
      {{ (loading$ | async) ? 'Creating...' : 'Create Product' }}
    </button>
  </form>
</div>
