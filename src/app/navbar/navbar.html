<nav class="navbar">
  <div class="navbar-brand" (click)="navigateToHome()" style="cursor: pointer">
    <h1>Product Store</h1>
  </div>

  <div class="navbar-search">
    <input
      type="text"
      placeholder="Search products..."
      (input)="onSearchInput($event)"
      class="search-input"
    />
  </div>

  <button *ngIf="(auth.isAuthenticated$ | async) === true" (click)="auth.logOut()">Logout</button>

  <a *ngIf="(auth.isAuthenticated$ | async) === false" routerLink="/login"> Login </a>

  <div class="navbar-cart" (click)="navigateToCart()">
    <span class="cart-icon">🛒</span>
    <span class="cart-count" *ngIf="cartCount > 0">{{ cartCount }}</span>
  </div>
</nav>
